name: reflectable
version: 4.0.12
description: >
  Reflection support based on code generation, using 'capabilities' to
  specify which operations to support, on which objects.
homepage: https://github.com/google/reflectable.dart
repository: https://github.com/open-runtime/reflectable
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  analyzer: 6.9.0
  build: ^2.4.2
  build_resolvers: ^2.4.4
  build_config: ^1.1.2
  build_runner: ^2.4.15
  build_runner_core: ^8.0.0
  dart_style: ^3.0.1
  glob: ^2.1.3
  logging: ^1.3.0
  package_config: ^2.2.0
  path: ^1.9.1
  source_span: ^1.10.1
  pub_semver: ^2.2.0
dev_dependencies:
  build_test: ^2.2.3
  lints: ^5.1.1
  test: ^1.25.0
